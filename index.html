<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirthana P — AI Content Creator</title>
    <meta name="description" content="Portfolio of Kirthana P, an AI Content Creator specializing in AI-generated images, videos, and creative visual storytelling using generative AI and prompt engineering." />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
